# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_commit\
$git_state\
$git_metrics\
$git_status\
$custom\
$sudo\
$cmd_duration\
$line_break\
$jobs\
$battery\
$character"""

# move the rest of the prompt to the right
right_format = """
$golang\
$nodejs\
$ruby\
$swift\
$python\
$java\
${custom.kotlin}\
$gradle\
$direnv\
"""

command_timeout = 1000

[directory]
fish_style_pwd_dir_length = 3

[git_branch]
symbol = '󰘬 '

[git_commit]
tag_disabled = false
tag_symbol = ' • '

[git_status]

ahead = '[↑](bold green)'
behind = '[↓](bold red)'
deleted = '[×](bold red)'
diverged = '[↑](bold green)[↓](bold red)'
untracked = '[?](bold red)'
stashed = '[≡](bold yellow)'
modified = '[!](bold yellow)'
staged = '[+](bold green)'
renamed = '[»](bold green)'

format = '((($ahead_behind)(\($conflicted$deleted$renamed$modified$typechanged$staged$untracked\))($stashed)) )'

[direnv]
symbol = '󱁿'
allowed_msg = '✓'
not_allowed_msg = '!'
denied_msg = '✗'
loaded_msg = '✓'
unloaded_msg = '-'
format = '[\[$symbol $loaded/$allowed\]](bold) '
disabled = false


[ruby]
symbol = '󰴭'
style = 'bold #cc342d'
version_format = '${raw}'
format = '[\[$symbol $version\]]($style) '

[nodejs]
symbol = ''
style = 'bold #339933'
version_format = '${raw}'
format = '[\[$symbol $version\]]($style) '

[package]
symbol = '󰏗'
style = 'bold yellow'
version_format = '${raw}'
format = '[\[$symbol $version\]]($style) '

[golang]
symbol = ''
style = 'bold #00ADD8'
version_format = '${raw}'
format = '[\[$symbol $version\]]($style) '
detect_files = [
    'go.mod',
    'go.sum',
    'go.work',
    'glide.yaml',
    'Gopkg.yml',
    'Gopkg.lock',
    '.go-version',
    # 'bitrise.yml',
]

[python]
symbol = '󰌠'
style = 'bold #4584b6'
version_format = '${raw}'
format = '[\[$symbol $version\]]($style) '

[swift]
symbol = '󰛥'
style = 'bold yellow'
version_format = '${raw}'
format = '[\[$symbol $version\]]($style) '

[java]
symbol = ''
style = 'bold #ED8B00'
version_format = '${raw}'
format = '| [\[$symbol $version\]]($style) '

[custom.kotlin]
symbol = ''
style = 'bold #936ff7'
command = '''sed -n 's/^kotlin *= *"\([^"]*\)".*/\1/p' gradle/libs.versions.toml'''
when = '''test -f gradle/libs.versions.toml'''
format = '[\[$symbol $output\]]($style) '

[gradle]
symbol = ''
style = 'bold #06A0CE'
version_format = '${raw}'
format = 'via [\[$symbol $version\]]($style) '
